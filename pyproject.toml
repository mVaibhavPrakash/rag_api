[project]
name = "processor"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = 'AzureAD\VaibhavPrakash', email = "vaibhav.prakash@cimpress.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "langgraph>=1.2.12",
    "pdfplumber>=0.11.10",
    "pydantic>=2.9.0",
    "python-docx>=1.1.2",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.12",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
processor = "processor:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
